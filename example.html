<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Chord Guitar Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        .chord-card {
            transition: all 0.2s ease;
            cursor: pointer;
            background: white;
        }

        .chord-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .chord-card.selected {
            outline: 4px solid #3b82f6;
            background-color: #eff6ff;
        }

        .practice-mode-active #main-content {
            display: none;
        }

        #practice-arena {
            display: none;
        }

        .practice-mode-active #practice-arena {
            display: flex;
            flex-direction: column;
            position: fixed;
            inset: 0;
            background-color: #0f172a;
            z-index: 50;
            overflow-y: auto;
        }

        .arena-grid {
            display: grid;
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Responsive grid logic for the arena */
        .grid-size-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-size-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-size-4 { grid-template-columns: repeat(2, 1fr); } /* 2x2 */
        .grid-size-5, .grid-size-6 { grid-template-columns: repeat(3, 1fr); }
        .grid-size-7, .grid-size-8 { grid-template-columns: repeat(4, 1fr); }

        @media (max-width: 768px) {
            .arena-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 0.75rem; }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <!-- Main UI -->
    <div id="main-content" class="max-w-5xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 mb-2">Chord Master</h1>
            <p class="text-slate-600">Select 2 to 8 chords for your one-minute change drill.</p>
        </header>

        <!-- Selection Bar -->
        <section class="sticky top-4 z-40 bg-white/90 backdrop-blur-md rounded-2xl shadow-xl border border-slate-200 p-4 mb-8">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex flex-wrap justify-center gap-2" id="selected-chord-list">
                    <span class="text-slate-400 font-medium py-2">Select 2-8 chords...</span>
                </div>
                
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <button id="clear-btn" class="flex-1 md:flex-none px-4 py-3 text-slate-500 font-bold hover:bg-slate-100 rounded-xl transition-colors">Clear</button>
                    <button id="start-btn" class="flex-[2] md:flex-none bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg disabled:opacity-30" disabled>
                        Start Drill
                    </button>
                </div>
            </div>
        </section>

        <!-- Chord Selection Grid -->
        <div id="chord-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </div>

    <!-- Practice Arena -->
    <div id="practice-arena" class="p-4 md:p-8 text-white">
        <div class="flex justify-between items-center mb-6 max-w-7xl mx-auto w-full">
            <div id="drill-timer" class="text-5xl md:text-6xl font-black text-blue-400 tabular-nums">01:00</div>
            <div class="hidden md:block text-slate-400 font-bold uppercase tracking-widest text-sm">Practice Transitions Between All Chords</div>
            <button id="stop-btn" class="bg-slate-800 hover:bg-red-600 text-white px-6 py-3 rounded-xl font-bold transition-colors">End Session</button>
        </div>

        <div id="prep-screen" class="flex-1 flex flex-col items-center justify-center">
            <h2 class="text-2xl text-slate-400 font-bold mb-4">Starting in...</h2>
            <div id="prep-timer" class="text-9xl font-black text-yellow-500">5</div>
        </div>

        <div id="active-screen" class="hidden flex-1">
            <div id="arena-chord-grid" class="arena-grid">
                <!-- All selected chords injected here -->
            </div>
        </div>
    </div>

    <script>
        const CHORD_DATA = [
            { name: "G", fingers: [[6, 3, 3], [5, 2, 2], [1, 3, 4]], muted: [], open: [4, 3, 2] },
            { name: "D", fingers: [[3, 2, 1], [2, 3, 3], [1, 2, 2]], muted: [6, 5], open: [4] },
            { name: "C", fingers: [[5, 3, 3], [4, 2, 2], [2, 1, 1]], muted: [6], open: [3, 1] },
            { name: "E", fingers: [[5, 2, 2], [4, 2, 3], [3, 1, 1]], muted: [], open: [6, 2, 1] },
            { name: "A", fingers: [[4, 2, 1], [3, 2, 2], [2, 2, 3]], muted: [6], open: [5, 1] },
            { name: "Am", fingers: [[4, 2, 2], [3, 2, 3], [2, 1, 1]], muted: [6], open: [5, 1] },
            { name: "Em", fingers: [[5, 2, 2], [4, 2, 3]], muted: [], open: [6, 3, 2, 1] },
            { name: "Dm", fingers: [[3, 2, 2], [2, 3, 3], [1, 1, 1]], muted: [6, 5], open: [4] },
            { name: "G7", fingers: [[6, 3, 3], [5, 2, 2], [1, 1, 1]], muted: [], open: [4, 3, 2] },
            { name: "D7", fingers: [[3, 2, 2], [2, 1, 1], [1, 2, 3]], muted: [6, 5], open: [4] },
            { name: "A7", fingers: [[4, 2, 2], [2, 2, 3]], muted: [6], open: [5, 3, 1] },
            { name: "C7", fingers: [[5, 3, 3], [4, 2, 2], [3, 3, 4], [2, 1, 1]], muted: [6], open: [1] }
        ];

        let selectedNames = [];
        let drillInterval = null;

        function createChordSVG(chord, isLarge = false) {
            const width = 240, height = 300;
            const fretTop = 85, fretBottom = 280, marginX = 30;
            const gridWidth = width - (marginX * 2);
            const gridHeight = fretBottom - fretTop;
            const stringSpacing = gridWidth / 5;
            const fretSpacing = gridHeight / 5;

            const stringWidth = 2;
            const nutWidth = isLarge ? 8 : 6;
            
            const halfString = stringWidth / 2;
            const firstStringX = marginX;
            const lastStringX = marginX + (5 * stringSpacing);

            // Alignment target for markers (X and O)
            const markerY = fretTop - 18; 

            let svg = `<svg viewBox="0 0 ${width} ${height}" class="w-full h-auto">`;
            
            // Chord Name
            svg += `<text x="${width/2}" y="45" text-anchor="middle" font-weight="900" font-size="${isLarge ? 52 : 44}" fill="currentColor">${chord.name}</text>`;
            
            // Muted/Open markers
            for (let i = 0; i < 6; i++) {
                const x = marginX + (i * stringSpacing);
                const sNum = 6 - i;
                if (chord.muted.includes(sNum)) {
                    // Muted 'X' marker - Fixed dy and dominant-baseline for perfect vertical centering
                    svg += `<text x="${x}" y="${markerY}" text-anchor="middle" dominant-baseline="middle" fill="#ef4444" font-weight="bold" font-size="20" dy="-0.05em">×</text>`;
                } else if (chord.open.includes(sNum)) {
                    // Open 'O' marker
                    svg += `<circle cx="${x}" cy="${markerY}" r="6" fill="none" stroke="#94a3b8" stroke-width="2.5" />`;
                }
            }

            // Strings (Vertical lines)
            for (let i = 0; i < 6; i++) {
                const x = marginX + (i * stringSpacing);
                svg += `<line x1="${x}" y1="${fretTop}" x2="${x}" y2="${fretBottom}" stroke="#94a3b8" stroke-width="${stringWidth}" />`;
            }

            // Frets (Horizontal lines)
            for (let i = 1; i <= 5; i++) {
                const y = fretTop + (i * fretSpacing);
                svg += `<line x1="${firstStringX}" y1="${y}" x2="${lastStringX}" y2="${y}" stroke="#e2e8f0" stroke-width="2" />`;
            }

            // The Nut (Top bar)
            svg += `<line x1="${firstStringX - halfString}" y1="${fretTop}" x2="${lastStringX + halfString}" y2="${fretTop}" stroke="currentColor" stroke-width="${nutWidth}" stroke-linecap="butt" />`;

            // Fingers
            chord.fingers.forEach(([s, f, n]) => {
                const x = marginX + ((6 - s) * stringSpacing);
                const y = fretTop + (f * fretSpacing) - (fretSpacing / 2);
                svg += `<circle cx="${x}" cy="${y}" r="${isLarge ? 16 : 14}" fill="#1e293b" />`;
                // REMOVED dy=".3em" to ensure text is perfectly centered within the circle using dominant-baseline="central"
                svg += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" fill="white" font-size="${isLarge ? 18 : 16}" font-weight="bold">${n}</text>`;
            });

            svg += `</svg>`;
            return svg;
        }

        function renderGrid() {
            const grid = document.getElementById('chord-grid');
            grid.innerHTML = ''; 
            CHORD_DATA.forEach(chord => {
                const div = document.createElement('div');
                div.className = 'chord-card p-4 rounded-2xl border-2 border-slate-200';
                div.dataset.name = chord.name;
                div.innerHTML = createChordSVG(chord);
                div.onclick = () => toggleChord(chord.name);
                grid.appendChild(div);
            });
        }

        function toggleChord(name) {
            const idx = selectedNames.indexOf(name);
            if (idx > -1) {
                selectedNames.splice(idx, 1);
            } else if (selectedNames.length < 8) {
                selectedNames.push(name);
            }
            updateUI();
        }

        function updateUI() {
            document.querySelectorAll('.chord-card').forEach(card => {
                card.classList.toggle('selected', selectedNames.includes(card.dataset.name));
            });

            const list = document.getElementById('selected-chord-list');
            if (selectedNames.length === 0) {
                list.innerHTML = '<span class="text-slate-400 font-medium py-2">Select 2-8 chords...</span>';
            } else {
                list.innerHTML = selectedNames.map(name => 
                    `<span class="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg font-bold border border-blue-200 flex items-center gap-2">
                        ${name}
                        <button onclick="event.stopPropagation(); toggleChord('${name}')" class="hover:text-red-500">×</button>
                    </span>`
                ).join('');
            }

            document.getElementById('start-btn').disabled = selectedNames.length < 2;
        }

        function playBeep(freq, dur) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.value = freq;
                g.gain.setValueAtTime(0.1, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
                o.start(); o.stop(ctx.currentTime + dur);
            } catch(e) {}
        }

        document.getElementById('clear-btn').onclick = () => {
            selectedNames = [];
            updateUI();
        };

        document.getElementById('start-btn').onclick = startDrill;
        document.getElementById('stop-btn').onclick = endDrill;

        function startDrill() {
            document.body.classList.add('practice-mode-active');
            const prepScreen = document.getElementById('prep-screen');
            const activeScreen = document.getElementById('active-screen');
            const prepTimer = document.getElementById('prep-timer');
            
            prepScreen.classList.remove('hidden');
            activeScreen.classList.add('hidden');

            let countdown = 5;
            prepTimer.textContent = countdown;

            const prepInt = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    prepTimer.textContent = countdown;
                    playBeep(440, 0.1);
                } else {
                    clearInterval(prepInt);
                    playBeep(880, 0.2);
                    runMainLoop();
                }
            }, 1000);
        }

        function runMainLoop() {
            document.getElementById('prep-screen').classList.add('hidden');
            const activeScreen = document.getElementById('active-screen');
            activeScreen.classList.remove('hidden');
            
            const timerEl = document.getElementById('drill-timer');
            const arenaGrid = document.getElementById('arena-chord-grid');
            
            arenaGrid.className = `arena-grid grid-size-${selectedNames.length}`;
            
            arenaGrid.innerHTML = selectedNames.map(name => {
                const chord = CHORD_DATA.find(c => c.name === name);
                return `<div class="bg-white rounded-3xl p-4 md:p-6 text-slate-900 shadow-2xl flex items-center justify-center">
                    ${createChordSVG(chord, true)}
                </div>`;
            }).join('');

            let totalTime = 60;
            drillInterval = setInterval(() => {
                totalTime--;
                timerEl.textContent = `00:${totalTime.toString().padStart(2, '0')}`;
                
                if (totalTime <= 5 && totalTime > 0) playBeep(440, 0.1);

                if (totalTime <= 0) {
                    playBeep(523, 0.5);
                    endDrill();
                }
            }, 1000);
        }

        function endDrill() {
            clearInterval(drillInterval);
            document.body.classList.remove('practice-mode-active');
            document.getElementById('drill-timer').textContent = "01:00";
        }

        window.onload = renderGrid;
    </script>
</body>
</html>
